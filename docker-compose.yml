services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: khallio
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: khallio_dev
    ports:
      - "5432:5432"
    volumes:
      - khallio_pg_data:/var/lib/postgresql/data

volumes:
  khallio_pg_data: